<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TVGarden+ Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>body{margin:0;background:black;} video{width:100%;height:100vh;object-fit:contain;}</style>
</head>
<body>
    <video id="video" controls autoplay></video>
    <script>
        var hls = null;
        var video = document.getElementById('video');

        function playStream(url) {
            console.log("playStream called with", url);

            // 1) Direct video files (MP4, MKV, TS)
            if (url.match(/\.(mp4|mkv|ts)$/i)) {
                video.src = url;
                video.play().catch(e => console.error("Native play error", e));
                return;
            }

            // 2) HLS streams (.m3u8)
            if (url.includes('.m3u8') && Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.error("HLS autoplay error", e));
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error("HLS error, falling back to native", data);
                    video.src = url;
                    video.play().catch(e => console.error("Fallback error", e));
                });
                return;
            }

            // 3) Generic (try native)
            video.src = url;
            video.play().catch(e => console.error("Generic play error", e));
        }

        function togglePause() {
            if (video.paused) {
                video.play();
                return false;
            } else {
                video.pause();
                return true;
            }
        }
        function isPaused() { return video.paused; }
        function setVolume(vol) { video.volume = Math.min(1, Math.max(0, vol)); }
        function toggleMute() { video.muted = !video.muted; }
    </script>
</body>
</html>
