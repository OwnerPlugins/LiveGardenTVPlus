<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TVGarden+ Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>body{margin:0;background:black;} video{width:100%;height:100vh;object-fit:contain;}</style>
</head>
<body>
    <video id="video" controls autoplay></video>
    <script>
        var hls = null;
        var video = document.getElementById('video');
        window.hls = hls;

        function playStream(url) {
            console.log("playStream called with", url);
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls();
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    // Remove or comment this line
                    // video.muted = true;
                    video.play().catch(e => console.error("autoplay blocked", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(e => console.error(e));
            }
        }

        function togglePause() {
            if (video.paused) {
                video.play();
                return false;
            } else {
                video.pause();
                return true;
            }
        }

        function isPaused() {
            return video.paused;
        }

        function setVolume(vol) { video.volume = Math.min(1, Math.max(0, vol)); }
        function toggleMute() { video.muted = !video.muted; }
    </script>
</body>
</html>
