<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TVGarden+ Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>body{margin:0;background:black;} video{width:100%;height:100vh;object-fit:contain;}</style>
</head>
<body>
    <!-- <video id="video" controls autoplay></video> -->
    <video id="video" autoplay></video>
    <script>
        var hls = null;
        var video = document.getElementById('video');

        function playStream(url) {
            console.log("playStream called with", url);
            if (url.match(/\.(mp4|mkv|ts)$/i)) {
                video.src = url;
                video.play().catch(e => console.error("Native play error", e));
                return;
            }
            if (url.includes('.m3u8') && Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({ maxBufferLength: 10, liveSyncDurationCount: 3 });
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.error("HLS autoplay error", e));
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error("HLS error, falling back to native", data);
                    video.src = url;
                    video.play().catch(e => console.error("Fallback error", e));
                });
                return;
            }
            video.src = url;
            video.play().catch(e => console.error("Generic play error", e));
        }



        function togglePause() {
            if (video.paused) {
                video.play();
                return false;
            } else {
                video.pause();
                return true;
            }
        }
        function isPaused() { return video.paused; }
        function setVolume(vol) { video.volume = Math.min(1, Math.max(0, vol)); }
        // function toggleMute() { video.muted = !video.muted; }
        function toggleMute() {
            video.muted = !video.muted;
            return video.muted;
        }

        function getMuteState() {
            return video.muted;
        }        
        
        // ---------- TIMESHIFT / DVR ----------
        function getCurrentTime() {
            return video.currentTime.toString();
        }

        function getBufferInfo() {
            if (!video.buffered.length) return JSON.stringify({ start: 0, end: 0, current: video.currentTime });
            var idx = 0;
            for (var i = 0; i < video.buffered.length; i++) {
                if (video.currentTime >= video.buffered.start(i) && video.currentTime <= video.buffered.end(i)) {
                    idx = i; break;
                }
            }
            var start = video.buffered.start(idx);
            var end = video.buffered.end(idx);
            return JSON.stringify({ start: start, end: end, current: video.currentTime });
        }

        function seekToTime(time) {
            if (isFinite(time) && !isNaN(time)) {
                video.currentTime = time;
            }
        }

        function seekToLive() {
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = video.duration - 1;
            } else if (video.seekable && video.seekable.length) {
                var end = video.seekable.end(video.seekable.length - 1);
                video.currentTime = end - 1;
            }
        }
        
        function isLiveStream() {
            return !!(hls && hls.config && hls.config.liveSyncDuration !== undefined) || (video.duration === Infinity);
        }

        function getBufferInfo() {
            if (!video.buffered.length) return { start: 0, end: 0, current: 0, isLive: false };
            var bufferedEnd = video.buffered.end(video.buffered.length - 1);
            var isLive = !isFinite(video.duration) || Math.abs(video.duration - bufferedEnd) < 0.5;
            return {
                start: video.buffered.start(0),
                end: bufferedEnd,
                current: video.currentTime,
                isLive: isLive,
                duration: isLive ? bufferedEnd : video.duration
            };
        }
    </script>
</body>
</html>
