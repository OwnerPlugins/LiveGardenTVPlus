name: Build and Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WPF app (self-contained, win-x64)
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --framework net10.0-windows `
          --runtime win-x64 `
          --self-contained true `
          --output publish_output

    - name: Copy extra folders (Languages, Themes, PlayerHost)
      run: |
        Copy-Item -Path "LiveGardenTV+/Languages" -Destination "publish_output/Languages" -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/Themes"   -Destination "publish_output/Themes"   -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/PlayerHost" -Destination "publish_output/PlayerHost" -Recurse -Force

    - name: Clean WebView2 cache and unnecessary files
      run: |
        # Rimuove cache WebView2 (se presente)
        if (Test-Path "publish_output/WebView2") {
          Remove-Item "publish_output/WebView2" -Recurse -Force
        }
        # Rimuove .pdb .xml .config (esempi)
        Get-ChildItem "publish_output" -Recurse -Include *.pdb, *.xml, *.config | Remove-Item -Force

    - name: Create ZIP file in repository root
      run: |
        Compress-Archive -Path "publish_output/*" -DestinationPath "LiveGardenTVPlus.zip" -Force
        Write-Host "ZIP creato: $((Get-Item 'LiveGardenTVPlus.zip').Length) bytes"

    - name: Debug - List files in root after ZIP creation
      run: Get-ChildItem -Path . -Name

    - name: Commit and push ZIP
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Aggiunge LiveGardenTVPlus.zip [skip ci]"
        file_pattern: "LiveGardenTVPlus.zip"
        commit_user_name: "GitHub Actions"
        commit_user_email: "actions@github.com"