name: Build and Create ZIP Artifact

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish app (standalone, no single file)
      run: |
        dotnet publish LiveGardenTV+.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o ./publish_temp
      working-directory: ./LiveGardenTV+

    - name: Remove WebView2 cache and unnecessary files
      run: |
        # Rimuovi cartelle WebView2 e cache grafica
        Get-ChildItem -Path ./publish_temp -Directory | Where-Object { 
          $_.Name -match "WebView2|Cache|Crashpad|GPUCache|GrShaderCache|Dawn|ShaderCache|Graphite" 
        } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        
        # Rimuovi file .pdb, .xml, .log, .lock
        Get-ChildItem -Path ./publish_temp -File | Where-Object { 
          $_.Extension -in ".pdb", ".xml", ".log", ".lock", ".tmp" 
        } | Remove-Item -Force -ErrorAction SilentlyContinue
        
        # Rimuovi runtimes non necessari (arm64, x86)
        Remove-Item -Recurse -Force ./publish_temp/runtimes/win-arm64 -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./publish_temp/runtimes/win-x86 -ErrorAction SilentlyContinue
      working-directory: ./LiveGardenTV+

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish_temp/* -DestinationPath ./LiveGardenTVPlus.zip -Force
      working-directory: ./LiveGardenTV+

    - name: Upload ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveGardenTVPlus
        path: ./LiveGardenTV+/LiveGardenTVPlus.zip