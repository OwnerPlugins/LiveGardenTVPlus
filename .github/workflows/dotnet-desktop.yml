name: Build and zip release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish app (folder structure, no single file)
      run: |
        dotnet publish LiveGardenTV+.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o ./publish_temp
      working-directory: ./LiveGardenTV+

    - name: Clean up unnecessary files and folders
      run: |
        # Rimuovi qualsiasi cartella che contiene "WebView2" o cache grafica
        Get-ChildItem -Path ./publish_temp -Directory | Where-Object { 
          $_.Name -match "WebView2|Cache|Crashpad|GPUCache|GrShaderCache|Dawn|ShaderCache|Graphite" 
        } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        
        # Rimuovi file .pdb, .xml, .log, .lock
        Get-ChildItem -Path ./publish_temp -File | Where-Object { 
          $_.Extension -in ".pdb", ".xml", ".log", ".lock", ".tmp" 
        } | Remove-Item -Force -ErrorAction SilentlyContinue
        
        # Rimuovi runtimes non necessari (arm64, x86)
        Remove-Item -Recurse -Force ./publish_temp/runtimes/win-arm64 -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./publish_temp/runtimes/win-x86 -ErrorAction SilentlyContinue
      working-directory: ./LiveGardenTV+

    - name: Create ZIP
      run: |
        Compress-Archive -Path ./publish_temp/* -DestinationPath "${{ github.workspace }}/LiveGardenTVPlus.zip" -Force
      working-directory: ./LiveGardenTV+

    - name: Upload artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: LiveGardenTVPlus
        path: ${{ github.workspace }}/LiveGardenTVPlus.zip

    - name: Commit and push ZIP to repository
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update build ${{ github.run_number }}"
        file_pattern: "LiveGardenTVPlus.zip"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"