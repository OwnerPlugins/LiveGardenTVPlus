name: Build and Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish (framework-dependent)
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --framework net10.0-windows `
          --output publish_output `
          --self-contained false

    - name: Copia cartelle extra (Languages, Themes, PlayerHost)
      run: |
        Copy-Item -Path "LiveGardenTV+/Languages" -Destination "publish_output/Languages" -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/Themes"   -Destination "publish_output/Themes"   -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/PlayerHost" -Destination "publish_output/PlayerHost" -Recurse -Force

    - name: Pulizia estrema
      run: |
        if (Test-Path "publish_output/runtimes") { Remove-Item "publish_output/runtimes" -Recurse -Force }
        Get-ChildItem "publish_output" -Recurse -Include *.pdb, *.xml, *.config, *.deps.json, *.runtimeconfig.json, *.manifest, *.pri, *.json -Exclude "userprefs.json" | Remove-Item -Force
        if (Test-Path "publish_output/WebView2") { Remove-Item "publish_output/WebView2" -Recurse -Force }
        Write-Host "Dimensione finale: $([math]::Round((Get-ChildItem 'publish_output' -Recurse | Measure-Object Length -Sum).Sum / 1MB,2)) MB"

    - name: Crea ZIP
      run: |
        Compress-Archive -Path "publish_output/*" -DestinationPath "LiveGardenTVPlus.zip" -Force

    - name: Commit e push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Aggiunge LiveGardenTVPlus.zip pulito [skip ci]"
        file_pattern: "LiveGardenTVPlus.zip"