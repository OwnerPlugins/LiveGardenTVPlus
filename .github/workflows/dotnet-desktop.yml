name: Build and Create ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish app
      run: |
        dotnet publish LiveGardenTV+.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -p:PublishDir=./publish_output
      working-directory: ./LiveGardenTV+

    - name: Debug - Check what was published
      run: |
        echo "Contenuto di publish_output:"
        dir ./publish_output
        echo "Contenuto di publish_output (ricorsivo):"
        dir ./publish_output -Recurse
      working-directory: ./LiveGardenTV+

    - name: Clean up WebView2 cache
      run: |
        if (Test-Path "./publish_output/LiveGardenTV+.exe.WebView2") {
          Remove-Item -Recurse -Force "./publish_output/LiveGardenTV+.exe.WebView2"
        }
        Get-ChildItem -Path ./publish_output -Directory | Where-Object { 
          $_.Name -match "Cache|Crashpad|GPUCache|GrShaderCache|Dawn|ShaderCache|Graphite" 
        } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem -Path ./publish_output -File | Where-Object { 
          $_.Extension -in ".pdb", ".xml", ".log", ".lock", ".tmp" 
        } | Remove-Item -Force -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./publish_output/runtimes/win-arm64 -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./publish_output/runtimes/win-x86 -ErrorAction SilentlyContinue
      working-directory: ./LiveGardenTV+

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish_output/* -DestinationPath ./LiveGardenTVPlus.zip -Force
      working-directory: ./LiveGardenTV+

    - name: Upload ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiveGardenTVPlus
        path: ./LiveGardenTV+/LiveGardenTVPlus.zip