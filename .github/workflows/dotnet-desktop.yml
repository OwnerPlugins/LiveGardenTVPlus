name: Build and Zip
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WPF app
      id: publish
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --framework net10.0-windows `
          --runtime win-x64 `
          --self-contained true `
          --output publish_output `
          -v diag  # log di diagnostica

    - name: VERIFICA 1 - Contenuto di publish_output
      run: |
        if (Test-Path "publish_output") {
          Write-Host "✅ publish_output esiste"
          $fileCount = (Get-ChildItem "publish_output" -Recurse | Measure-Object).Count
          Write-Host "📁 Trovati $fileCount file/directory in publish_output"
          Get-ChildItem "publish_output" -Recurse | Select-Object FullName, Length
        } else {
          Write-Error "❌ publish_output NON esiste!"
          exit 1
        }

    - name: COPIA cartelle extra (Languages, Themes, PlayerHost)
      run: |
        @('Languages','Themes','PlayerHost') | ForEach-Object {
          $source = "LiveGardenTV+/$_"
          $dest = "publish_output/$_"
          if (Test-Path $source) {
            Copy-Item -Path $source -Destination $dest -Recurse -Force
            Write-Host "✅ Copiato $_"
          } else {
            Write-Warning "⚠️ Cartella sorgente non trovata: $source"
          }
        }

    - name: PULIZIA file inutili
      run: |
        Get-ChildItem "publish_output" -Recurse -Include *.pdb, *.xml, *.config | Remove-Item -Force
        if (Test-Path "publish_output/WebView2") {
          Remove-Item "publish_output/WebView2" -Recurse -Force
        }

    - name: VERIFICA 2 - Contenuto dopo copia/pulizia
      run: |
        $finalCount = (Get-ChildItem "publish_output" -Recurse | Measure-Object).Count
        Write-Host "📁 Dopo copia/pulizia: $finalCount file/directory"
        Get-ChildItem "publish_output" | Select-Object Name, Length

    - name: CREA ZIP
      run: |
        $source = "${{ github.workspace }}\publish_output"
        $destination = "${{ github.workspace }}\LiveGardenTVPlus.zip"
        Compress-Archive -Path "$source\*" -DestinationPath $destination -Force
        if (Test-Path $destination) {
          Write-Host "✅ ZIP creato: $((Get-Item $destination).Length) bytes"
        } else {
          Write-Error "❌ Creazione ZIP fallita!"
          exit 1
        }

    - name: VERIFICA 3 - Contenuto root e ZIP
      run: |
        Get-ChildItem -Path . -Name
        if (Test-Path "LiveGardenTVPlus.zip") {
          Write-Host "✅ ZIP trovato nella root: $((Get-Item 'LiveGardenTVPlus.zip').Length) bytes"
        } else {
          Write-Error "❌ ZIP non trovato nella root!"
          exit 1
        }

    - name: Commit e push ZIP
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Aggiunge LiveGardenTVPlus.zip [skip ci]"
        file_pattern: "LiveGardenTVPlus.zip"
        commit_user_name: "GitHub Actions"
        commit_user_email: "actions@github.com"