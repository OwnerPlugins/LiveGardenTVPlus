name: Build and Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish (framework-dependent)
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --framework net10.0-windows `
          --output publish_output `
          --self-contained false

    - name: Copia cartelle extra (Languages, Themes, PlayerHost)
      run: |
        Copy-Item -Path "LiveGardenTV+/Languages" -Destination "publish_output/Languages" -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/Themes"   -Destination "publish_output/Themes"   -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/PlayerHost" -Destination "publish_output/PlayerHost" -Recurse -Force

    - name: (Opzionale) Verifica contenuto prima dello zip
      run: |
        Write-Host "Contenuto di publish_output:"
        Get-ChildItem "publish_output" -Recurse | Select-Object FullName, Length

    - name: Crea ZIP
      run: |
        Compress-Archive -Path "publish_output/*" -DestinationPath "LiveGardenTVPlus.zip" -Force
        Write-Host "✅ ZIP creato: $((Get-Item 'LiveGardenTVPlus.zip').Length) bytes"

    - name: Forza aggiunta e commit ZIP
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -f LiveGardenTVPlus.zip
        git commit -m "Aggiunge LiveGardenTVPlus.zip [skip ci]" || echo "Nessuna modifica da committare"
        git push