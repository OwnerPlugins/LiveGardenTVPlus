name: Build e commit dello zip con l'exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pubblica l'app
      run: dotnet publish LiveGardenTV+.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ./publish_exe --verbosity quiet -nowarn:CS8618,CS8602,CS8622,CS8625,CS8600,CS8601
      working-directory: ./LiveGardenTV+  # <-- Questo è il comando che mancava

    - name: Rimuove cartella WebView2 cache (se creata)
      run: |
        if (Test-Path "./publish_exe/LiveGardenTV+.exe.WebView2") {
          Remove-Item -Recurse -Force "./publish_exe/LiveGardenTV+.exe.WebView2"
        }
      working-directory: ./LiveGardenTV+  # Operazione dentro la cartella del progetto

    - name: Crea zip
      run: |
        Compress-Archive -Path ./publish_exe/* -DestinationPath ./LiveGardenTVPlus.zip -Force
      working-directory: ./LiveGardenTV+  # Crea lo zip dentro la cartella del progetto

    - name: Sposta lo zip nella root del repo per il commit
      run: |
        Move-Item -Path ./LiveGardenTV+/LiveGardenTVPlus.zip -Destination ./LiveGardenTVPlus.zip -Force

    - name: Configura git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit e push dello zip
      run: |
        git add LiveGardenTVPlus.zip
        git commit -m "Aggiorna build - ${{ github.run_number }}" || echo "Nessuna modifica"
        git push origin HEAD:main