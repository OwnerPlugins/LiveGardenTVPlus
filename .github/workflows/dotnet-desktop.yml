name: Build and commit zip with exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish app
      run: |
        dotnet publish LiveGardenTV+.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -o ./publish_output
      working-directory: ./LiveGardenTV+

    - name: Copy additional resource folders (Languages, Themes, PlayerHost)
      run: |
        # Copia le cartelle dalla source del progetto (che è nella cartella LiveGardenTV+)
        Copy-Item -Path ./Languages -Destination ./publish_output/Languages -Recurse -Force
        Copy-Item -Path ./Themes -Destination ./publish_output/Themes -Recurse -Force
        Copy-Item -Path ./PlayerHost -Destination ./publish_output/PlayerHost -Recurse -Force
      working-directory: ./LiveGardenTV+

    - name: Remove WebView2 cache and other junk
      run: |
        # Elimina qualsiasi cartella che contiene "WebView2" o "Cache" (case insensitive)
        Get-ChildItem -Path ./publish_output -Directory | Where-Object { 
          $_.Name -match "WebView2|Cache|Crashpad|GPUCache|GrShaderCache|Dawn|ShaderCache|Graphite|logs|temp" 
        } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        
        # Elimina file spuri
        Get-ChildItem -Path ./publish_output -File | Where-Object { 
          $_.Extension -in ".pdb", ".xml", ".log", ".lock", ".tmp", ".db", ".json" 
        } | Remove-Item -Force -ErrorAction SilentlyContinue
        
        # Elimina sottocartelle runtime inutili
        Remove-Item -Recurse -Force ./publish_output/runtimes/win-arm64 -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force ./publish_output/runtimes/win-x86 -ErrorAction SilentlyContinue
        
        # Se esiste ancora qualche cartella sospetta, la elimino con nome esatto
        if (Test-Path "./publish_output/LiveGardenTV+.exe.WebView2") {
          Remove-Item -Recurse -Force "./publish_output/LiveGardenTV+.exe.WebView2"
        }
      working-directory: ./LiveGardenTV+

    - name: Create zip in repository root
      run: |
        Compress-Archive -Path ./publish_output/* -DestinationPath ${{ github.workspace }}/LiveGardenTVPlus.zip -Force
      working-directory: ./LiveGardenTV+

    - name: Commit and push zip
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update build - ${{ github.run_number }}"
        file_pattern: "LiveGardenTVPlus.zip"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"