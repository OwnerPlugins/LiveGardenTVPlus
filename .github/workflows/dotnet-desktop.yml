name: Build and Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "LiveGardenTV+/LiveGardenTV+.csproj"

    - name: Publish WPF app (framework-dependent)
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --framework net10.0-windows `
          --output publish_output `
          --self-contained false `
          --no-restore

    - name: Copy extra folders (Languages, Themes, PlayerHost)
      run: |
        Copy-Item -Path "LiveGardenTV+/Languages" -Destination "publish_output/Languages" -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/Themes"   -Destination "publish_output/Themes"   -Recurse -Force
        Copy-Item -Path "LiveGardenTV+/PlayerHost" -Destination "publish_output/PlayerHost" -Recurse -Force

    - name: Add WebView2Loader.dll for all architectures
      run: |
        # Trova il pacchetto Microsoft.Web.WebView2 nella cache di NuGet
        $packageRoot = "$env:USERPROFILE\.nuget\packages\microsoft.web.webview2"
        if (-not (Test-Path $packageRoot)) {
          Write-Error "Pacchetto Microsoft.Web.WebView2 non trovato nella cache NuGet."
          exit 1
        }
        $version = Get-ChildItem $packageRoot | Sort-Object Name -Descending | Select-Object -First 1
        $loaderPath = Join-Path $version.FullName "build\native"
        Write-Host "Usando WebView2Loader da: $loaderPath"

        # Definisce le tre architetture e i relativi file DLL
        $archs = @(
            @{ Arch = "win-arm64"; File = "arm64\WebView2Loader.dll" },
            @{ Arch = "win-x64";   File = "x64\WebView2Loader.dll" },
            @{ Arch = "win-x86";   File = "x86\WebView2Loader.dll" }
        )

        foreach ($item in $archs) {
          $src = Join-Path $loaderPath $item.File
          $destDir = "publish_output\runtimes\$($item.Arch)\native"
          $dest = Join-Path $destDir "WebView2Loader.dll"
          New-Item -Path $destDir -ItemType Directory -Force | Out-Null
          if (Test-Path $src) {
            Copy-Item $src $dest -Force
            Write-Host "Copiato $src -> $dest"
          } else {
            Write-Warning "File non trovato: $src"
          }
        }

    - name: Create ZIP file
      run: |
        Compress-Archive -Path "publish_output/*" -DestinationPath "LiveGardenTVPlus.zip" -Force
        Write-Host "✅ ZIP creato: $((Get-Item 'LiveGardenTVPlus.zip').Length) bytes"

    - name: Commit and push ZIP (force add)
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -f LiveGardenTVPlus.zip
        git commit -m "Aggiorna LiveGardenTVPlus.zip [skip ci]" || echo "Nessuna modifica da committare"
        git push