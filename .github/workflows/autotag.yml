name: Build and Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "LiveGardenTV+/LiveGardenTV+.csproj"

    - name: Publish self-contained single-file
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -o ./publish

    - name: Create version.txt
      run: |
        $version = (Select-Xml -Path "LiveGardenTV+/LiveGardenTV+.csproj" -XPath "//AssemblyVersion").Node.InnerText
        Write-Output $version | Out-File -FilePath version.txt -Encoding ascii

    - name: Commit version.txt
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update version.txt"
        file_pattern: "version.txt"
        add_f: true

    - name: Create ZIP file (SOLO exe)
      run: |
        Compress-Archive -Path "./publish/*" -DestinationPath "LiveGardenTVPlus.zip" -Force

    - name: Commit and push ZIP
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -f LiveGardenTVPlus.zip
        git commit -m "Aggiorna LiveGardenTVPlus.zip [skip ci]" || echo "Nessuna modifica da committare"
        git push
