name: Auto Tag and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore "LiveGardenTV+/LiveGardenTV+.csproj"

    - name: Publish self-contained single-file
      run: |
        dotnet publish "LiveGardenTV+/LiveGardenTV+.csproj" `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -o ./publish

    - name: Create version.txt
      run: |
        $ns = @{msb = "http://schemas.microsoft.com/developer/msbuild/2003"}
        $version = (Select-Xml -Path "LiveGardenTV+/LiveGardenTV+.csproj" -XPath "//msb:AssemblyVersion" -Namespace $ns).Node.InnerText
        if ([string]::IsNullOrWhiteSpace($version)) {
          $version = (Select-Xml -Path "LiveGardenTV+/LiveGardenTV+.csproj" -XPath "//AssemblyVersion").Node.InnerText
        }
        Write-Output $version | Out-File -FilePath version.txt -Encoding ascii
        Write-Host "✅ Created version.txt with version $version"

    - name: Commit version.txt
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update version.txt"
        file_pattern: "version.txt"
        add_f: true

    - name: Get version from csproj for tag
      id: get_version
      run: |
        $ns = @{msb = "http://schemas.microsoft.com/developer/msbuild/2003"}
        $version = (Select-Xml -Path "LiveGardenTV+/LiveGardenTV+.csproj" -XPath "//msb:AssemblyVersion" -Namespace $ns).Node.InnerText
        if ([string]::IsNullOrWhiteSpace($version)) {
          $version = (Select-Xml -Path "LiveGardenTV+/LiveGardenTV+.csproj" -XPath "//AssemblyVersion").Node.InnerText
        }
        if ([string]::IsNullOrWhiteSpace($version)) {
          Write-Error "❌ Impossibile trovare AssemblyVersion nel csproj"
          exit 1
        }
        echo "version=$version" >> $GITHUB_OUTPUT
        Write-Host "✅ Version: $version"

    - name: Create and push tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        $tag = "v${{ steps.get_version.outputs.version }}"
        if (git rev-parse "$tag" 2>$null) {
          Write-Host "⚠️ Tag $tag already exists"
        } else {
          git tag "$tag"
          git push origin "$tag"
          Write-Host "✅ Created and pushed tag: $tag"
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
